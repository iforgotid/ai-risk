# 循环融资记录。每周在 weeks 末尾追加一项。
# fact 只写当周简报里已经出现的句子，source 原样粘贴。
# 这一周没有新事实时：entries 写成 []，并用 note 说明。不要填推测。

weeks:
  - date: "2026-10-26"
    brief: /briefs/2026-10-26/
    note: "财务时点是英伟达 FY27Q2，截至 2026-07-26。简报日期是 2026-10-26。"
    entries:
      - kind: 担保
        parties: "英伟达；SB Energy / OpenAI 园区"
        fact: "担保最高 1085 亿美元，其中 SB Energy / OpenAI 园区 1050 亿美元。"
        source: "https://www.sec.gov/Archives/edgar/data/1045810/000104581026000073/q2fy27cfocommentary.htm"
      - kind: 供应商信用
        parties: "英伟达；部分投资级大客户"
        fact: "应收账款 631 亿美元，DSO 由 45 天升至 60 天，原因是给部分投资级大客户延长账期。应收账款账期拉长和大额担保，意味着英伟达在为客户提供信用。"
        source: "https://www.sec.gov/Archives/edgar/data/1045810/000104581026000073/q2fy27cfocommentary.htm"
  - date: "2026-11-02"
    brief: /briefs/2026-11-02/
    note: "本周新增：博通为 Anthropic SPV 提供残值支持；英伟达、AMD 认购 Meta 股权融资；亚马逊披露有担保的供应商融资贷款便利；英伟达与 Nscale 的担保仍在洽谈、未签约。未查到英伟达对 OpenAI、CoreWeave、xAI 的新投资或担保。"
    entries:
      - kind: 担保
        parties: "博通；Anthropic 630 亿美元 SPV（美银、花旗、摩根士丹利、Blackstone）"
        fact: "博通提供残值支持，金额等于第一留置权规模；按 8-K，责任为所欠租金的 72.5% 减去机柜价值，部署完成时最大未折现约 430 亿美元"
        source: "https://www.sec.gov/Archives/edgar/data/1730168/000119312526434271/d148323d8k.htm"
      - kind: 股权投资
        parties: "英伟达、AMD；Meta"
        fact: "英伟达 30 亿美元，AMD 10 亿美元；同时 Meta 扩大 Vera Rubin 部署，AMD Helios 机柜已在 Meta 运行"
        source: "https://www.cnbc.com/2026/10/27/nvidia-invest-meta.html"
      - kind: 担保
        parties: "英伟达；Nscale 西弗吉尼亚园区（租户 Anthropic）"
        fact: "英伟达据报正洽谈为 Nscale 西弗吉尼亚园区建设债务提供担保（未签约，金额未披露）"
        source: "https://techcrunch.com/2026/10/30/nvidia-weighs-playing-the-cosigner-for-nscales-ai-data-center-in-west-virginia/"
      - kind: 供应商信用
        parties: "亚马逊；未披露的供应商或贷款方"
        fact: "10-Q 披露供应商融资安排，含一笔有担保贷款便利，2027Q1–2028Q3 期间按需提款，最高约 800 亿美元，浮动利率，每笔 5 年到期，以所购资产设定担保，计入长期债务"
        source: "https://www.sec.gov/Archives/edgar/data/1018724/000101872426000040/amzn-20260930.htm"
  - date: "2026-11-09"
    brief: /briefs/2026-11-09/
    note: "本周新增：谷歌为 TeraWulf Justified 园区的 Anthropic 租约提供信用支持；AMD 10-Q 披露为合作方数据中心提供的担保最高 85 亿美元；AMD 对 OpenAI、Meta 认股权证入账，未确认的 45 亿美元将冲减未来收入。英伟达与 Nscale 的担保仍在洽谈、未签约。未查到英伟达对 OpenAI、CoreWeave、xAI 的新投资或担保。"
    entries:
      - kind: 担保
        parties: "谷歌；TeraWulf Justified 园区（租户 Anthropic）"
        fact: "支持约 190 亿美元、20 年、约 401MW 的 Anthropic 租约所对应的债务融资。如 Anthropic 付款违约或破产，谷歌可选择付清到期租金并承接租约，或支付终止费（随时间摊销）并取得 Raylan 股权；8-K 未披露终止费金额和担保上限"
        source: "https://www.sec.gov/Archives/edgar/data/1083301/000162828026069810/wulf-20261104.htm"
      - kind: 担保
        parties: "AMD；未披露的商业合作方"
        fact: "截至 9 月 26 日最大潜在支付 85 亿美元：租约担保 77 亿美元（剩余期限最长 15 年）+ 债务担保 7.5 亿美元（最长 6 个月）；另有拟转租给合作方、尚未起租的数据中心租约 133 亿美元"
        source: "https://www.sec.gov/Archives/edgar/data/2488/000000248826000191/amd-20260926.htm"
      - kind: 股权换算力
        parties: "AMD；OpenAI、Meta"
        fact: "两份认股权证各最多 1.6 亿股、行权价 0.01 美元；9 月 26 日认股权证负债 12 亿美元；未确认的授予日公允价值 45 亿美元，将随相关收入确认按比例冲减收入"
        source: "https://www.sec.gov/Archives/edgar/data/2488/000000248826000191/amd-20260926.htm"
  - date: "2026-11-16"
    brief: /briefs/2026-11-16/
    note: "本周新增：Anthropic 以 IPO 价向 AMD、Broadcom、谷歌、美光、微软、英伟达、台积电私募 260 亿美元（谷歌、英伟达各 100 亿美元）；Nscale S-1/A 新披露英伟达对其 Ward County 租约的担保（最高 8.603 亿美元，协议签于 2025-10-14）及英伟达 10 亿美元认购；黄仁勋辞职后，据 The Information，Kress 曾反对 2500 亿美元 OpenAI 信用支持提议（从未签署），已签的 1050 亿美元俄亥俄担保仍有效。未查到英伟达对 CoreWeave、xAI 的新投资或担保；英伟达与 Nscale 西弗吉尼亚担保洽谈本周未找到进展。"
    entries:
      - kind: 股权投资
        parties: "AMD、Broadcom、谷歌、美光、微软、英伟达、台积电；Anthropic"
        fact: "以 IPO 价私募 260 亿美元无投票权 N 类股，谷歌和英伟达各 100 亿美元；Anthropic 算力与基础设施承诺 9009 亿美元"
        source: "https://techcrunch.com/2026/11/10/anthropic-sets-ipo-price-range-of-70-to-78-per-share-to-reach-an-implied-valuation-of-1-404-trillion/"
      - kind: 担保
        parties: "英伟达；Nscale 得州 Ward County 设施"
        fact: "英伟达为 Nscale 租约前 5 年付款义务提供担保，最高 8.603 亿美元；Nscale 在托管账户存放 4.7 亿美元作为对英伟达的追索；对价为认股权证。协议签于 2025 年 10 月 14 日，本周 S-1/A 披露"
        source: "https://www.sec.gov/Archives/edgar/data/2110365/000119312526458722/ck0002110365-20261112.htm"
      - kind: 股权投资
        parties: "英伟达等投资人；Nscale"
        fact: "9 月认购协议共 33.6 亿美元：23.6 亿美元无担保可转换贷款票据（投资人含英伟达），另 10 亿美元向英伟达发行，预计 11 月 16 日前后交割"
        source: "https://www.sec.gov/Archives/edgar/data/2110365/000119312526458722/ck0002110365-20261112.htm"
      - kind: 担保
        parties: "英伟达；OpenAI"
        fact: "据 The Information，Kress 任 CFO 时反对黄仁勋支持的 2500 亿美元 OpenAI 信用支持提议（从未签署），英伟达预计放缓投资策略；已签的 OpenAI 俄亥俄园区租约担保最高 1050 亿美元仍有效"
        source: "https://finance.yahoo.com/technology/ai/articles/nvidia-interim-ceo-pushed-back-114212136.html"
  - date: "2026-11-23"
    brief: /briefs/2026-11-23/
    note: "本周新增：英伟达 FY27Q3 最大担保敞口升至 1180 亿美元（新增 95 亿美元电力与系统信用支持）；新云算力承诺 320 亿美元（摩根士丹利称上季 360 亿），并写明新云未取得融资时可削减或取消；应收账款 810 亿美元、DSO 64 天。Apollo 与 Goldman 为 SpaceX 采购英伟达 Vera Rubin 定价约 440 亿美元票据（第三方出资）。The Bear Cave 汇总 AMD 客户支持安排约 330 亿美元。Nscale 西弗吉尼亚项目的英伟达担保仍在洽谈。未查到英伟达对 OpenAI、CoreWeave、xAI 的新投资或新担保。"
    entries:
      - kind: 担保
        parties: "英伟达；新云、SB Energy / OpenAI 园区及电力与系统融资"
        fact: "截至 10 月 25 日最大担保敞口 1180 亿美元（上季 1085 亿）：新云土地、电力与厂房 35 亿，SB Energy / OpenAI 园区 1050 亿，新增电力与系统信用支持 95 亿；按楼栋完工逐步生效，迄今未付款"
        source: "https://www.sec.gov/Archives/edgar/data/1045810/000104581026000088/q3fy27cfocommentary.htm"
      - kind: 算力采购承诺
        parties: "英伟达；新云"
        fact: "新云算力承诺 320 亿美元，只有在新云取得采购融资、算力部署并经英伟达验收后才生效，否则可能被削减或取消；英伟达在前期销售设备时确认收入，并可分成新云第三方收入。摩根士丹利称上季为 360 亿美元"
        source: "https://www.cnbc.com/2026/11/18/nvidia-neocloud-financing.html"
      - kind: 供应商信用
        parties: "英伟达；部分投资级大客户"
        fact: "应收账款 810 亿美元（上季 631 亿），DSO 由 60 天升至 64 天，原因含对部分投资级客户的大额多季度协议延长账期"
        source: "https://www.sec.gov/Archives/edgar/data/1045810/000104581026000088/q3fy27cfocommentary.htm"
      - kind: 资产支持融资
        parties: "Apollo、Goldman Sachs 等；SpaceX（采购英伟达 Vera Rubin）"
        fact: "约 440 亿美元优先与次级票据，用于为 SpaceX 采购英伟达 Vera Rubin GPU 及相关设备，租约预计 2027 年上半年随交付起租；第三方出资，非英伟达自身融资"
        source: "https://ir.apollo.com/news-events/press-releases/detail/662/apollo-and-goldman-sachs-announce-pricing-of-44-billion"
      - kind: 担保
        parties: "AMD；合作方与 AI 客户"
        fact: "The Bear Cave 汇总：租约担保最高 85 亿美元、代客户签订 133 亿美元未来数据中心租约、62 亿美元云算力兜底采购、有条件股权投资上限 51 亿美元，合计约 330 亿美元"
        source: "https://thebearcave.substack.com/p/problems-at-amd-amd"


